[package]
name = "ferrow-query"
description = "Query parser and parallel matcher for Ferrow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Deterministic cancellation hook for tests only; never enabled by
# normal consumers (see SearchOptions::on_block).
test-hooks = []

[dependencies]
ferrow-index = { path = "../ferrow-index" }
memchr = "2"
rayon = "1"
regex = "1.13.1"
regex-syntax = "0.8.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
ferrow-index = { path = "../ferrow-index", features = ["test-hooks", "bench-internals"] }
divan = "0.1.21"
ferrow-fixture = { path = "../ferrow-fixture" }
ferrow-ipc = { path = "../ferrow-ipc" }
ferrow-query = { path = ".", features = ["test-hooks"] }

[[bench]]
name = "m1_bench"
harness = false
