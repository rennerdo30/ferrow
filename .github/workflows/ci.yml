name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Explicit bash runs with -eo pipefail, so a failing or timed-out
    # measurement is not hidden behind `| tee`.
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  deny:
    name: cargo-deny (licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
  service:
    name: service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Explicit bash runs with -eo pipefail, so a failing or timed-out
    # measurement is not hidden behind `| tee`.
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo build --locked -p ferrow -p ferrowd
      - name: Windows service lifecycle and failure cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci-service-windows.ps1
          ./scripts/ci-service-windows.ps1 -FailAfterStart
      - name: Linux service lifecycle and failure cleanup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci-service-linux.sh
          result=0
          bash scripts/ci-service-linux.sh fail-after-start || result=$?
          test "$result" -eq 42
      - name: Windows always cleanup
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-service-windows.ps1 -CleanupOnly
      - name: Linux always cleanup
        if: always() && runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci-service-linux.sh cleanup
      # macOS: run mode only, plus a plist lint (per M2 acceptance).
      - name: macOS run mode and plist lint
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint packaging/launchd/com.github.rennerdo30.ferrowd.plist
          bin="$PWD/target/debug"
          tree="$RUNNER_TEMP/svc-tree"
          mkdir -p "$tree"
          echo x > "$tree/ci-needle.txt"
          export FERROW_ENDPOINT_NAME="ferrow-ci-$RANDOM"
          "$bin/ferrow" service run "$tree" &
          daemon_pid=$!
          trap 'kill $daemon_pid 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 30); do
            if "$bin/ferrow" status 2>/dev/null | grep -q "mode: service"; then ok=1; break; fi
            sleep 0.5
          done
          test -n "$ok"
          "$bin/ferrow" search ci-needle | grep -q "ci-needle.txt"
          kill $daemon_pid
  bench:
    name: bench (5M fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit bash runs with -eo pipefail, so a failing or timed-out
    # measurement is not hidden behind `| tee`.
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Stack layers still compare to main, not to their feature-branch base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: main
          path: .bench-base
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Test regression comparison and CLI on trivial inputs
        run: python3 -m unittest discover -s scripts -p 'test_bench_gate.py'
      - name: Build head before either measured arm
        run: |
          test "$(id -u)" -ne 0
          cargo build --release --locked -p ferrow
          cargo build --release --locked -p ferrow-query --example service_bench
          cargo build --release --locked -p ferrow-query --example latency_probe
          cargo build --release --locked -p ferrow-query --example metadata_bench
          cargo build --release --locked -p ferrow-walk --example scan_cost
          cargo bench --no-run -p ferrow-query --bench m1_bench --locked
      - name: Build main in a separate target directory
        if: github.event_name == 'pull_request'
        working-directory: .bench-base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ferrow-base-target
        run: |
          # The small retry driver is identical; each copy links its own arm's libraries.
          cp ../crates/ferrow-query/examples/latency_probe.rs crates/ferrow-query/examples/latency_probe.rs
          cargo build --release --locked -p ferrow
          cargo build --release --locked -p ferrow-query --example latency_probe
          cargo build --release --locked -p ferrow-query --example service_bench
          cargo bench --no-run -p ferrow-query --bench m1_bench --locked
      - name: Smoke benchmark chain with 16 entries
        env:
          FERROW_BENCH_ENTRIES: "16"
          FERROW_BENCH_INDEX_PATH: ${{ runner.temp }}/ferrow-small.bin
          FERROW_MEASURES_ONLY: "1"
        run: |
          cargo bench -p ferrow-query --bench m1_bench --locked -- --sample-count 1 --min-time 0.01
          timeout -k 5s 120s target/release/examples/service_bench "$PWD/target/release/ferrow" "$RUNNER_TEMP/ferrow-small.bin"
          timeout -k 5s 120s target/release/examples/metadata_bench "$RUNNER_TEMP/ferrow-small-metadata.bin"
          timeout -k 5s 120s target/release/examples/service_bench "$PWD/target/release/ferrow" "$RUNNER_TEMP/ferrow-small-metadata.bin" modified
      - name: Measure main in-process
        if: github.event_name == 'pull_request'
        working-directory: .bench-base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ferrow-base-target
          FERROW_MEASURES_ONLY: "1"
          FERROW_BENCH_INDEX_PATH: ${{ runner.temp }}/ferrow-base.bin
        run: |
          git rev-parse HEAD
          timeout -k 5s 600s cargo bench -p ferrow-query --bench m1_bench --locked -- --sample-count 10 --min-time 0.2 2>&1 | tee "$GITHUB_WORKSPACE/base-output.txt"
      - name: Measure head in-process
        env:
          FERROW_BENCH_INDEX_PATH: ${{ runner.temp }}/ferrow-bench.bin
          FERROW_MEASURES_ONLY: "1"
        run: |
          git rev-parse HEAD
          timeout -k 5s 600s cargo bench -p ferrow-query --bench m1_bench --locked -- --sample-count 10 --min-time 0.2 2>&1 | tee bench-output.txt
      - name: Measure main service using its matching protocol and index format
        if: github.event_name == 'pull_request'
        run: timeout -k 5s 120s "$RUNNER_TEMP/ferrow-base-target/release/examples/service_bench" "$RUNNER_TEMP/ferrow-base-target/release/ferrow" "$RUNNER_TEMP/ferrow-base.bin" 2>&1 | tee -a base-output.txt
      - name: Measure head service IPC
        run: timeout -k 5s 120s target/release/examples/service_bench "$PWD/target/release/ferrow" "$RUNNER_TEMP/ferrow-bench.bin" 2>&1 | tee -a bench-output.txt
      - name: Observe default columns and modified newest-first queries
        run: |
          git rev-parse HEAD
          timeout -k 5s 600s target/release/examples/metadata_bench "$RUNNER_TEMP/ferrow-metadata.bin" 2>&1 | tee -a bench-output.txt
          timeout -k 5s 120s target/release/examples/service_bench "$PWD/target/release/ferrow" "$RUNNER_TEMP/ferrow-metadata.bin" modified 2>&1 | tee -a bench-output.txt
          timeout -k 5s 120s target/release/examples/scan_cost "$RUNNER_TEMP/ferrow-scan-fixture" 2>&1 | tee -a bench-output.txt
      - name: Write additive head summary
        if: always()
        run: ./scripts/bench-summary.sh bench-output.txt
      - name: Gate paired main and head medians
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/bench-gate.py base-output.txt bench-output.txt --require-metadata \
            --base-probe "$RUNNER_TEMP/ferrow-base-target/release/examples/latency_probe" \
            --head-probe "$PWD/target/release/examples/latency_probe" \
            --base-binary "$RUNNER_TEMP/ferrow-base-target/release/ferrow" \
            --head-binary "$PWD/target/release/ferrow" \
            --base-index "$RUNNER_TEMP/ferrow-base.bin" --head-index "$RUNNER_TEMP/ferrow-bench.bin"
