name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  deny:
    name: cargo-deny (licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
  service:
    name: service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo build --locked -p ferrow -p ferrowd
      - name: Windows service lifecycle and failure cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci-service-windows.ps1
          ./scripts/ci-service-windows.ps1 -FailAfterStart
      - name: Linux service lifecycle and failure cleanup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci-service-linux.sh
          result=0
          bash scripts/ci-service-linux.sh fail-after-start || result=$?
          test "$result" -eq 42
      - name: Windows always cleanup
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-service-windows.ps1 -CleanupOnly
      - name: Linux always cleanup
        if: always() && runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci-service-linux.sh cleanup
      # macOS: run mode only, plus a plist lint (per M2 acceptance).
      - name: macOS run mode and plist lint
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint packaging/launchd/com.github.rennerdo30.ferrowd.plist
          bin="$PWD/target/debug"
          tree="$RUNNER_TEMP/svc-tree"
          mkdir -p "$tree"
          echo x > "$tree/ci-needle.txt"
          export FERROW_ENDPOINT_NAME="ferrow-ci-$RANDOM"
          "$bin/ferrow" service run "$tree" &
          daemon_pid=$!
          trap 'kill $daemon_pid 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 30); do
            if "$bin/ferrow" status 2>/dev/null | grep -q "mode: service"; then ok=1; break; fi
            sleep 0.5
          done
          test -n "$ok"
          "$bin/ferrow" search ci-needle | grep -q "ci-needle.txt"
          kill $daemon_pid
  bench:
    name: bench (5M fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational until the owner confirms the SPEC section 3 targets.
    continue-on-error: true
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Run the 5M-entry benchmark
        run: cargo bench -p ferrow-query --bench m1_bench --locked -- --sample-count 10 --min-time 0.2 2>&1 | tee bench-output.txt
      - name: Write the job summary table
        if: always()
        run: ./scripts/bench-summary.sh bench-output.txt
