name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Explicit bash runs with -eo pipefail, so a failing or timed-out
    # measurement is not hidden behind `| tee`.
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  deny:
    name: cargo-deny (licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
  service:
    name: service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Explicit bash runs with -eo pipefail, so a failing or timed-out
    # measurement is not hidden behind `| tee`.
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo build --locked -p ferrow -p ferrowd
      - name: Windows service lifecycle and failure cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/ci-service-windows.ps1
          ./scripts/ci-service-windows.ps1 -FailAfterStart
      - name: Linux service lifecycle and failure cleanup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci-service-linux.sh
          result=0
          bash scripts/ci-service-linux.sh fail-after-start || result=$?
          test "$result" -eq 42
      - name: Windows always cleanup
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-service-windows.ps1 -CleanupOnly
      - name: Linux always cleanup
        if: always() && runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci-service-linux.sh cleanup
      # macOS: run mode only, plus a plist lint (per M2 acceptance).
      - name: macOS run mode and plist lint
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint packaging/launchd/com.github.rennerdo30.ferrowd.plist
          bin="$PWD/target/debug"
          tree="$RUNNER_TEMP/svc-tree"
          mkdir -p "$tree"
          echo x > "$tree/ci-needle.txt"
          export FERROW_ENDPOINT_NAME="ferrow-ci-$RANDOM"
          "$bin/ferrow" service run "$tree" &
          daemon_pid=$!
          trap 'kill $daemon_pid 2>/dev/null || true' EXIT
          ok=""
          for i in $(seq 1 30); do
            if "$bin/ferrow" status 2>/dev/null | grep -q "mode: service"; then ok=1; break; fi
            sleep 0.5
          done
          test -n "$ok"
          "$bin/ferrow" search ci-needle | grep -q "ci-needle.txt"
          kill $daemon_pid
  bench:
    name: bench (5M fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit bash runs with -eo pipefail, so a failing or timed-out
    # measurement is not hidden behind `| tee`.
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Stack layers still compare to main, not to their feature-branch base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: main
          path: .bench-base
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Test regression comparison and CLI on trivial inputs
        run: python3 -m unittest discover -s scripts -p 'test_bench_gate.py'
      - name: Prepare the identical selective retry driver for both arms
        run: |
          cat > crates/ferrow-query/examples/latency_probe.rs <<'RUST'
          //! Selective paired CI latency retry. Built against each arm's libraries.
          use ferrow_index::Index;
          use ferrow_ipc::{Client, Endpoint};
          use ferrow_query::{CancelToken, Query, SearchOptions, count, search};
          use std::process::{Child, Command, Stdio};
          use std::time::{Duration, Instant};
          
          struct Service(Child);
          impl Drop for Service {
              fn drop(&mut self) {
                  let _ = self.0.kill();
                  let _ = self.0.wait();
              }
          }
          
          fn main() -> Result<(), Box<dyn std::error::Error>> {
              let args: Vec<_> = std::env::args().skip(1).collect();
              if args.len() != 5 {
                  return Err("expected binary, index, kind, query, operation".into());
              }
              let path = std::path::Path::new(&args[1]);
              let mut samples = Vec::new();
              let mut hits = 0;
              if args[2] == "load" {
                  for _ in 0..3 {
                      let (index, timing) = Index::load_with_timings(path)?;
                      hits = index.len();
                      samples.push(timing.total);
                  }
              } else {
                  let index = Index::load(path)?;
                  let query = Query::parse(&args[3])?;
                  let page = args[4] == "first_page_ms";
                  if !page && args[4] != "full_count_ms" {
                      return Err("unknown operation".into());
                  }
                  let options = SearchOptions {
                      limit: Some(100),
                      ..SearchOptions::default()
                  };
                  match args[2].as_str() {
                      "in-process" => {
                          for _ in 0..5 {
                              let started = Instant::now();
                              hits = if page {
                                  let result = search(&index, &query, &options);
                                  if result.cancelled {
                                      return Err("cancelled page".into());
                                  }
                                  result.hits.len()
                              } else {
                                  let (n, cancelled) = count(&index, &query, &CancelToken::new());
                                  if cancelled {
                                      return Err("cancelled count".into());
                                  }
                                  n
                              };
                              samples.push(started.elapsed());
                          }
                      }
                      "IPC" => {
                          let name = format!("ferrow-retry-{}", std::process::id());
                          let endpoint = Endpoint::named(&name);
                          let mut service = Service(
                              Command::new(&args[0])
                                  .args(["service", "run", "--index"])
                                  .arg(path)
                                  .env("FERROW_ENDPOINT_NAME", name)
                                  .stdout(Stdio::null())
                                  .stderr(Stdio::inherit())
                                  .spawn()?,
                          );
                          eprintln!("FERROW-RETRY-ACTIVE pid={} timeout_s=120", service.0.id());
                          let startup = Instant::now();
                          let mut client = loop {
                              if startup.elapsed() > Duration::from_secs(30)
                                  || service.0.try_wait()?.is_some()
                              {
                                  return Err("retry service startup failed".into());
                              }
                              if let Ok(mut client) = Client::connect(&endpoint)
                                  && let Ok((n, _, _)) = client.status()
                              {
                                  if n != index.len() as u64 {
                                      return Err("wrong fixture".into());
                                  }
                                  break client;
                              }
                              std::thread::sleep(Duration::from_millis(10));
                          };
                          let expected = search(&index, &query, &options);
                          let expected_paths: Vec<_> = expected
                              .hits
                              .iter()
                              .map(|&id| {
                                  let mut bytes = Vec::new();
                                  index.path_bytes(id, &mut bytes);
                                  bytes
                              })
                              .collect();
                          let (total, _) = count(&index, &query, &CancelToken::new());
                          for _ in 0..5 {
                              let started = Instant::now();
                              if page {
                                  let paths = client.query(&args[3], 100)?;
                                  samples.push(started.elapsed());
                                  if paths != expected_paths {
                                      return Err("retry content/order mismatch".into());
                                  }
                                  hits = paths.len();
                              } else {
                                  let n = client.count(&args[3])?;
                                  samples.push(started.elapsed());
                                  if n != total as u64 {
                                      return Err("retry count mismatch".into());
                                  }
                                  hits = n as usize;
                              }
                          }
                      }
                      _ => return Err("unknown retry kind".into()),
                  }
              }
              samples.sort_unstable();
              println!(
                  "FERROW-RETRY value_ms={:.6} hits={hits}",
                  samples[samples.len() / 2].as_secs_f64() * 1000.0
              );
              Ok(())
          }
          RUST
      - name: Build head before either measured arm
        run: |
          test "$(id -u)" -ne 0
          cargo build --release --locked -p ferrow
          cargo build --release --locked -p ferrow-query --example service_bench
          cargo build --release --locked -p ferrow-query --example latency_probe
          cargo bench --no-run -p ferrow-query --bench m1_bench --locked
      - name: Build main in a separate target directory
        if: github.event_name == 'pull_request'
        working-directory: .bench-base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ferrow-base-target
        run: |
          # The small retry driver is identical; each copy links its own arm's libraries.
          cp ../crates/ferrow-query/examples/latency_probe.rs crates/ferrow-query/examples/latency_probe.rs
          cargo build --release --locked -p ferrow
          cargo build --release --locked -p ferrow-query --example latency_probe
          cargo bench --no-run -p ferrow-query --bench m1_bench --locked
      - name: Smoke benchmark chain with 16 entries
        env:
          FERROW_BENCH_ENTRIES: "16"
          FERROW_BENCH_INDEX_PATH: ${{ runner.temp }}/ferrow-small.bin
          FERROW_MEASURES_ONLY: "1"
        run: |
          cargo bench -p ferrow-query --bench m1_bench --locked -- --sample-count 1 --min-time 0.01
          timeout -k 5s 120s target/release/examples/service_bench "$PWD/target/release/ferrow" "$RUNNER_TEMP/ferrow-small.bin"
      - name: Measure main in-process
        if: github.event_name == 'pull_request'
        working-directory: .bench-base
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ferrow-base-target
          FERROW_MEASURES_ONLY: "1"
          FERROW_BENCH_INDEX_PATH: ${{ runner.temp }}/ferrow-base.bin
        run: |
          git rev-parse HEAD
          timeout -k 5s 600s cargo bench -p ferrow-query --bench m1_bench --locked -- --sample-count 10 --min-time 0.2 2>&1 | tee "$GITHUB_WORKSPACE/base-output.txt"
      - name: Measure head in-process
        env:
          FERROW_BENCH_INDEX_PATH: ${{ runner.temp }}/ferrow-bench.bin
          FERROW_MEASURES_ONLY: "1"
        run: |
          git rev-parse HEAD
          timeout -k 5s 600s cargo bench -p ferrow-query --bench m1_bench --locked -- --sample-count 10 --min-time 0.2 2>&1 | tee bench-output.txt
      - name: Measure main service through the same IPC harness and fixture
        if: github.event_name == 'pull_request'
        run: timeout -k 5s 120s target/release/examples/service_bench "$RUNNER_TEMP/ferrow-base-target/release/ferrow" "$RUNNER_TEMP/ferrow-bench.bin" 2>&1 | tee -a base-output.txt
      - name: Measure head service IPC
        run: timeout -k 5s 120s target/release/examples/service_bench "$PWD/target/release/ferrow" "$RUNNER_TEMP/ferrow-bench.bin" 2>&1 | tee -a bench-output.txt
      - name: Write additive head summary
        if: always()
        run: ./scripts/bench-summary.sh bench-output.txt
      - name: Gate paired main and head medians
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/bench-gate.py base-output.txt bench-output.txt \
            --base-probe "$RUNNER_TEMP/ferrow-base-target/release/examples/latency_probe" \
            --head-probe "$PWD/target/release/examples/latency_probe" \
            --base-binary "$RUNNER_TEMP/ferrow-base-target/release/ferrow" \
            --head-binary "$PWD/target/release/ferrow" \
            --base-index "$RUNNER_TEMP/ferrow-base.bin" --head-index "$RUNNER_TEMP/ferrow-bench.bin"
