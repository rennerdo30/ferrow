name: gui-screenshots
# Renders every screen of the desktop app to PNG files (docs/gui-screenshots.md)
# and uploads them as the `gui-screenshots` artifact, for human review of UI
# changes. A separate, non-required workflow: it never gates a merge and
# never slows the jobs in ci.yml.
on:
  pull_request:
    paths:
      - 'crates/ferrow-gui/**'
      - '.github/workflows/gui-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gui-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    name: screenshots (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      FERROW_SCREENSHOT_DIR: ${{ github.workspace }}/gui-screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Lint the harness code
        run: cargo clippy --workspace --all-targets --features ferrow-gui/screenshots --locked -- -D warnings
      - name: Harness unit tests
        run: cargo test -p ferrow-gui --bin ferrow-gui --features screenshots --locked
      - name: Render the screens (offscreen, no window)
        run: >
          timeout -k 10s 1500s
          cargo test -p ferrow-gui --bin ferrow-gui --features screenshots --locked
          screenshots -- --ignored --nocapture
      - name: List the pictures
        if: always()
        run: ls -l "$FERROW_SCREENSHOT_DIR" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gui-screenshots
          path: gui-screenshots/*.png
          if-no-files-found: error
          retention-days: 14
