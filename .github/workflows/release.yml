name: release

# A version tag builds, tests and attaches the setup to a DRAFT GitHub release.
# Publishing the draft is the owner's yes (docs/RELEASING.md); nothing here
# publishes. Tags: vX.Y.Z-beta.N from main or beta (pre-release, Beta channel),
# vX.Y.Z from main or a release/X.Y branch (Stable channel).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (vX.Y.Z or vX.Y.Z-beta.N)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build and test the setup
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches the version and comes from an allowed branch
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?m)^\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"') { throw 'No workspace version' }
          $version = $Matches[1]
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$' -or $env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match the workspace version $version"
          }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE) { throw 'A release needs an existing tag, not a branch.' }
          $commit = git rev-list -n 1 $env:RELEASE_TAG
          $branches = git branch -r --contains $commit | ForEach-Object { $_.Trim() -replace '^origin/', '' }
          $beta = $env:RELEASE_TAG.Contains('-')
          $allowed = if ($beta) { $branches | Where-Object { $_ -in 'main', 'beta' } } else { $branches | Where-Object { $_ -eq 'main' -or $_ -like 'release/*' } }
          if (!$allowed) {
            $want = if ($beta) { 'main or beta' } else { 'main or a release/X.Y branch' }
            throw "Tag commit $commit is not on $want (found on: $($branches -join ', '))"
          }
          Write-Host "Tag $env:RELEASE_TAG ($commit) is on: $($allowed -join ', ')"
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Release build
        run: cargo build --release --locked -p ferrow-gui -p ferrow -p ferrowd -p ferrow-update -p ferrow-winsearch
      - name: Package the setup (pinned NSIS)
        shell: pwsh
        run: |
          $makensis = ./scripts/fetch-nsis.ps1 -Destination "$env:RUNNER_TEMP/nsis"
          ./scripts/package.ps1 -MakeNsis $makensis -BinDir target/release
      - name: Installer lifecycle on the disposable runner
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Setup (Resolve-Path "artifacts/installer/Ferrow-$($env:RELEASE_TAG.TrimStart('v'))-setup.exe") -Version $env:RELEASE_TAG.TrimStart('v')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            artifacts/installer/Ferrow-*-setup.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

  draft:
    name: draft release (owner publishes)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist
      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # Notes: this version's CHANGELOG section, else generated notes.
          awk -v v="$version" '$0 ~ "^## "v"[[:space:]]*$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md || true
          {
            echo
            echo "**Install:** run the setup below, or in Ferrow open Settings, Updates, Check now. The app checks every download against SHA256SUMS.txt."
          } >> notes.md
          flags=(--draft --verify-tag --title "Ferrow $RELEASE_TAG" --notes-file notes.md)
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Never touch a published release; refresh only a draft.
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $RELEASE_TAG is already published; nothing changed." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* "${flags[@]}"
          fi
          echo "Draft ready: publish it on GitHub to release $RELEASE_TAG."
