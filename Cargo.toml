[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.5"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/rennerdo30/ferrow"
authors = ["rennerdo30"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2   # dependencies run fast and compile once

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The winsearch DLL runs inside SearchHost.exe: build it with this
# profile so its catch_unwind guard keeps a panic in Ferrow code from
# aborting the shell. `panic` cannot be set per package, so the DLL
# gets its own profile; scripts/package.ps1 builds it separately.
[profile.winsearch]
inherits = "release"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
