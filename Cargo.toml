[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-beta.4"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/rennerdo30/ferrow"
authors = ["rennerdo30"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2   # dependencies run fast and compile once

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
